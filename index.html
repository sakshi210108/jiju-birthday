<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday JIJU ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Stars -->
<div id="stars"></div>

<!-- Welcome Screen -->
<div id="welcome">

    <h1>🎉 A Special Birthday Surprise 🎉</h1>

    <p>Someone has a gift waiting for you...</p>

    <button id="startBtn">🎁 Open Gift</button>

</div>

<!-- Terminal -->
<div id="terminal">

    <div id="terminalHeader">

        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>

        <span>PyBirthdayWish Terminal</span>

    </div>

    <pre id="screen"></pre>

</div>

<!-- Audio -->
<audio id="music" loop preload="auto">
    <source src="HappyBirthday.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>

</html>
