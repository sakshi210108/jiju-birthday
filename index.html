<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="birthdaySong" autoplay loop>
        <source src="HappyBirthday.mp3" type="audio/mp3">
    </audio>

    <div class="container">

        <h1>🎉 Happy Birthday 🎉</h1>

        <p class="intro">
            Wishing you a day filled with happiness, smiles and beautiful memories ❤️
        </p>

        <div class="gift" id="gift">
            🎁
        </div>

        <button onclick="openGift()">Open Gift 🎁</button>

        <div id="message" class="hidden">
            <h2>🎂 Surprise! 🎂</h2>
            <p>
                May your life always be full of joy, success and endless happiness.
                Have an amazing birthday! ❤️
            </p>

            <div class="cake">
                🎂
            </div>
        </div>

    </div>


    <div id="confetti"></div>

    <script src="script.js"></script>

</body>
</html>
