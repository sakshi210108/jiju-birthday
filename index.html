<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday JIJU ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Animated Background -->
<div id="background"></div>

<!-- Stars -->
<div id="stars"></div>

<!-- Welcome Screen -->
<section id="welcome">

    <div id="giftContainer">

        <div id="gift">
            🎁
        </div>

        <h1>A Special Surprise</h1>

        <p>Click the Gift to Begin</p>

    </div>

</section>

<!-- Boot Screen -->
<section id="boot">

<pre id="bootText">

Microsoft Windows [Version 10.0]

C:\Users\JIJU>

Loading Birthday Surprise...

</pre>

</section>

<!-- Terminal -->
<section id="terminal">

<div id="terminalHeader">

<div class="dot red"></div>
<div class="dot yellow"></div>
<div class="dot green"></div>

<span>PyBirthdayWish</span>

</div>

<pre id="screen"></pre>

</section>

<!-- Final Message -->

<section id="finalMessage">

<h1>🎉 HAPPY BIRTHDAY JIJU 🎉</h1>

<p>

May your life always be filled with
love, happiness,
success and laughter.

❤️ Have an Amazing Birthday ❤️

</p>

<button id="restart">

🎁 Replay Surprise

</button>

</section>

<!-- Music -->

<audio id="music" loop>

<source src="HappyBirthday.mp3" type="audio/mpeg">

</audio>

<!-- Canvas -->

<canvas id="fireworks"></canvas>

<script src="script.js"></script>

</body>

</html>
